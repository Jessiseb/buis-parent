# langchain4j 阿里云百炼配置
# API Key 通过环境变量注入（必填），本地开发可 export 后再启动
langchain4j.community.dashscope.chat-model.api-key=${ALIYUN_AI_API_KEY}
langchain4j.community.dashscope.chat-model.model-name=qwen-max
langchain4j.community.dashscope.embedding-model.api-key=${ALIYUN_AI_API_KEY}
langchain4j.community.dashscope.embedding-model.model-name=text-embedding-v3
